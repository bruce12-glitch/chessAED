[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gochess-aed"
version = "0.1.0"
description = "A reproducible Go/Chess hybrid testbed for strategic bad-minima research."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Inbasekaran S"}]
dependencies = ["numpy", "pyyaml", "matplotlib"]

[project.optional-dependencies]
openspiel = ["open-spiel>=2.0,<3"]
test = ["pytest>=8"]

[project.scripts]
gochess = "gochess.cli:main"

[tool.setuptools.packages.find]
include = ["gochess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
